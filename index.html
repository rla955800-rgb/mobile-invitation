<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>'26년 결혼기념일 해피점심</title>
  <meta name="theme-color" content="#dceaf7">

  <!-- 링크 공유 미리보기: 메신저는 JS를 실행하지 않으므로 EVENT와 같은 값을 여기에도 직접 적는다 -->
  <meta name="description" content="2026년 11월 28일(토) 오후 12시 30분, 한남 사피드 서울에서 함께해요. 김영남 · 강정화 · 김지율">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="모바일 초대장">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:url" content="https://rla955800-rgb.github.io/mobile-invitation/">
  <meta property="og:title" content="'26년 결혼기념일 해피점심">
  <meta property="og:description" content="2026년 11월 28일(토) 오후 12시 30분, 한남 사피드 서울에서 함께해요. 김영남 · 강정화 · 김지율">
  <!-- 이미지를 바꾸면 ?v= 숫자를 올려 메신저 캐시를 피한다 -->
  <meta property="og:image" content="https://rla955800-rgb.github.io/mobile-invitation/images/og-image.png?v=2">
  <meta property="og:image:secure_url" content="https://rla955800-rgb.github.io/mobile-invitation/images/og-image.png?v=2">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="'26년 결혼기념일 해피점심 초대장, 2026년 11월 28일 오후 12시 30분, 한남 사피드 서울">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="'26년 결혼기념일 해피점심">
  <meta name="twitter:description" content="2026년 11월 28일(토) 오후 12시 30분, 한남 사피드 서울에서 함께해요.">
  <meta name="twitter:image" content="https://rla955800-rgb.github.io/mobile-invitation/images/og-image.png?v=2">
  <link rel="image_src" href="https://rla955800-rgb.github.io/mobile-invitation/images/og-image.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <main class="card">
    <header class="hero">
      <p class="hero-eyebrow">You're invited</p>
      <h1 class="hero-title" data-event="title">행사 이름</h1>
      <p class="hero-date" data-event="dateText">날짜</p>
      <p class="dday-badge" id="dday-badge">D-?</p>
    </header>

    <section class="section greeting">
      <h2 class="section-title">초대합니다</h2>
      <p>
        결혼기념일을 맞아<br>
        사랑하는 가족과 함께<br>
        따뜻한 점심을 나누려 합니다.<br>
        함께해 주시면 큰 기쁨이 되겠습니다.
      </p>
    </section>

    <section class="section attendee-section">
      <h2 class="section-title">함께하는 사람</h2>
      <p class="attendee-count" id="attendee-count"></p>
      <ul class="attendee-list" id="attendee-list"></ul>
    </section>

    <section class="section countdown-section">
      <h2 class="section-title">행사까지 남은 시간</h2>
      <div class="countdown" id="countdown" role="timer">
        <div class="countdown-item">
          <span class="countdown-num" data-unit="days">00</span>
          <span class="countdown-label">일</span>
        </div>
        <div class="countdown-item">
          <span class="countdown-num" data-unit="hours">00</span>
          <span class="countdown-label">시간</span>
        </div>
        <div class="countdown-item">
          <span class="countdown-num" data-unit="minutes">00</span>
          <span class="countdown-label">분</span>
        </div>
        <div class="countdown-item">
          <span class="countdown-num" data-unit="seconds">00</span>
          <span class="countdown-label">초</span>
        </div>
      </div>
      <p class="countdown-message" id="countdown-message"></p>
    </section>

    <section class="section map-section">
      <h2 class="section-title">오시는 길</h2>
      <p class="place-name" data-event="placeName">장소 이름</p>
      <p class="place-address" data-event="address">주소</p>

      <div class="map-frame">
        <iframe
          id="map-iframe"
          title="행사 장소 지도"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          allowfullscreen></iframe>
      </div>

      <div class="map-buttons">
        <a class="btn" id="naver-link" target="_blank" rel="noopener">네이버 지도</a>
        <a class="btn" id="kakao-link" target="_blank" rel="noopener">카카오맵</a>
        <button class="btn btn-outline" id="copy-address" type="button">주소 복사</button>
      </div>
      <p class="copy-status" id="copy-status" aria-live="polite"></p>
    </section>

    <footer class="footer">
      <p>함께해 주셔서 감사합니다.</p>
    </footer>
  </main>
</body>
</html>
